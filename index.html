<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デトックスチャレンジ</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7f5;margin:0;padding:12px}.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}h1{text-align:center}h2{color:#2a7d44}label{display:block;font-weight:bold;margin-top:10px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px}textarea{min-height:70px}button{width:100%;padding:16px;margin-top:10px;border:0;border-radius:12px;color:#fff;font-size:18px}.blue{background:#087af5}.green{background:#06c755}.orange{background:#ff9500}.notice{background:#fff9e8;border-left:5px solid #ff9500}.row{display:flex;gap:2em;margin:8px 0}.row label{display:flex;align-items:center;font-weight:normal}.row input{width:auto;margin-left:4px}.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto;transform:scale(1.2)}.status{padding:10px;background:#eef8ef;border-radius:8px;color:#2a7d44;font-weight:bold;margin-top:8px}.rangeValue{text-align:center;font-size:26px;line-height:1.2;font-weight:bold;color:#2a7d44;margin:8px 0 2px}.rangeScale{display:flex;justify-content:space-between;color:#666;font-size:13px;padding:0 2px;margin-top:-2px}#preview{white-space:pre-wrap;background:#fff;padding:15px;border-radius:12px;margin-top:12px}.reset{display:block;width:auto;margin:45px 0 0 auto;padding:8px 12px;background:#eee;color:#666;border:1px solid #aaa;font-size:12px}
</style></head><body><h1>📩 デトックスチャレンジ</h1><div class="card notice">チェックを外した項目は、「LINEで送る」および「テキストでコピー」の対象から除外されます。<br>入力内容は日付ごとに自動保存され、LINE送信後も保持されます。<div id="saveStatus" class="status">自動保存を準備しています</div></div>
<div class="card"><h2>📅 今週のテーマ</h2><div id="weekTitle" class="status"></div><p id="weekDesc"></p></div>
<div class="card"><label class="ck"><input type="checkbox" id="incDay" checked>DAY・日付</label><input type="date" id="reportDate"><div id="dayStatus" class="status"></div></div>
<div class="card"><h2>🌿 今日のMISSION</h2><label class="ck"><input type="checkbox" id="incM1" checked>MISSION1</label><input id="m1"><div class="row"><label>○<input type="radio" name="r1" value="○" checked></label><label>△<input type="radio" name="r1" value="△"></label><label>×<input type="radio" name="r1" value="×"></label></div><label class="ck"><input type="checkbox" id="incM2" checked>MISSION2</label><input id="m2"><div class="row"><label>○<input type="radio" name="r2" value="○" checked></label><label>△<input type="radio" name="r2" value="△"></label><label>×<input type="radio" name="r2" value="×"></label></div><label class="ck"><input type="checkbox" id="incM3" checked>MISSION3</label><input id="m3"><div class="row"><label>○<input type="radio" name="r3" value="○" checked></label><label>△<input type="radio" name="r3" value="△"></label><label>×<input type="radio" name="r3" value="×"></label></div></div><div class="card"><h2>🍽 食べたもの</h2><label class="ck"><input type="checkbox" id="incBreakfast" checked>🍋 朝</label><textarea id="breakfast"></textarea><label class="ck"><input type="checkbox" id="incLunch" checked>🍙 昼</label><textarea id="lunch"></textarea><label class="ck"><input type="checkbox" id="incSnack" checked>🍪 おやつ</label><textarea id="snack"></textarea><label class="ck"><input type="checkbox" id="incDinner" checked>🌙 夜</label><textarea id="dinner"></textarea></div><div class="card"><h2>💧 水分</h2><label class="ck"><input type="checkbox" id="incWater" checked>水分</label><label>水(L)</label><input id="water" type="number" step="0.1"><label>その他</label><input id="otherDrink"></div>
<div class="card"><h2>💊 サプリメント</h2><label class="ck"><input type="checkbox" id="incSupplement" checked>サプリメント</label><select id="supplement"><option>規定通り</option><option>飲み忘れあり</option></select></div>
<div class="card"><h2>🏃 活動・運動</h2><label class="ck"><input type="checkbox" id="incExercise" checked>活動・運動</label><textarea id="exercise"></textarea><label class="ck"><input type="checkbox" id="incMove" checked>食後に動けた</label><label>朝</label><select id="move1"><option>○</option><option>△</option><option>×</option></select><label>昼</label><select id="move2"><option>○</option><option>△</option><option>×</option></select><label>夜</label><select id="move3"><option>○</option><option>△</option><option>×</option></select></div><div class="card"><h2>😴 睡眠</h2><label class="ck"><input type="checkbox" id="incSleep" checked>睡眠</label><label>就寝</label><input type="time" id="sleep"><label>起床</label><input type="time" id="wake"><label>中途覚醒</label><select id="awake"><option>なし</option><option>あり</option></select><label>朝の目覚め</label><select id="morning"><option>良い</option><option>普通</option><option>いまいち</option></select></div>
<div class="card"><h2>🍰 今日の欲求</h2><label class="ck"><input type="checkbox" id="incCraving" checked>甘いもの・カフェイン</label><label>甘いもの</label><div id="sweetValue" class="rangeValue">0</div><input type="range" min="0" max="4" step="1" value="0" id="sweet" aria-describedby="sweetValue"><div class="rangeScale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div><label>カフェイン</label><div id="caffeineValue" class="rangeValue">0</div><input type="range" min="0" max="4" step="1" value="0" id="caffeine" aria-describedby="caffeineValue"><div class="rangeScale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div></div>
<div class="card"><h2>⚡ 午後の疲れ・眠気</h2><label class="ck"><input type="checkbox" id="incFatigue" checked>午後の疲れ・眠気</label><div id="fatigueValue" class="rangeValue">0</div><input type="range" min="0" max="4" step="1" value="0" id="fatigue" aria-describedby="fatigueValue"><div class="rangeScale"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div></div>
<div class="card"><h2>💩 お通じ</h2><label class="ck"><input type="checkbox" id="incBowel" checked>お通じ</label><select id="bowel"><option>あり</option><option>なし</option></select></div>
<div class="card"><h2>⚖️ 体重</h2><label class="ck"><input type="checkbox" id="incWeight" checked>体重</label><input type="number" step="0.1" id="weight"></div>
<div class="card"><h2>📝 今日の気づき・身体の変化</h2><label class="ck"><input type="checkbox" id="incNote" checked>今日の気づき・身体の変化</label><textarea id="note"></textarea></div>
<button class="blue" onclick="previewText()">内容確認</button><button class="green" onclick="sendLine()">LINEで送る</button><button class="orange" onclick="copyText()">テキストでコピー</button><div id="preview"></div><button class="reset" onclick="resetDay()">この日をリセット</button>
<script>
const storage=(()=>{try{const k='__detox_test__';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);return{available:true,getItem:k=>window.localStorage.getItem(k),setItem:(k,v)=>window.localStorage.setItem(k,v),removeItem:k=>window.localStorage.removeItem(k)}}catch(e){const m=new Map();return{available:false,getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,v),removeItem:k=>m.delete(k)}}})();
const START='2026-08-17',END='2026-09-13',missionData={"1": ["今日1日、除去食ルールを守る", "水分を一気飲みせず、こまめに摂る", "夜までに、今の自分の状態を1つ観察する"], "2": ["一口ごとに、いつもより丁寧に噛む", "食事の最初に、野菜や食物繊維から食べる", "食後の「眠い・重い・まだ食べたい」を観察する"], "3": ["昼食または夕食後、2〜5分身体を動かす", "今日は、できるだけだらだら食べをしない", "夕方の空腹感を観察する"], "4": ["起床後、レモン＋りんご酢水を1杯", "朝の光を5〜10分浴びる", "朝の目覚めを観察する"], "5": ["今日の水分量を意識する", "一気飲みせず、数回に分けて飲む", "尿の色・回数を一度観察する"], "6": ["今日1日で、3色以上の野菜を食べる", "野菜＋たんぱく質＋良質な脂質を意識する", "食後のお腹の張りや満足感を観察する"], "7": ["レモン＋りんご酢水からスタート", "食後2〜5分、身体を動かす", "この1週間の変化を1つ見つける"], "8": ["今日から肉・魚を除去する", "植物性食品をしっかり摂る", "肉・魚がない食事の満足感を観察する"], "9": ["今日の便を観察する", "水分をこまめに摂る", "食物繊維を摂る"], "10": ["食事間に食べない時間をつくる", "間食前に空腹か習慣か確認する", "夜遅い食事を避ける"], "11": ["食物繊維を3種類以上摂る", "よく噛んで食べる", "お腹の張り・ガス・便通を観察する"], "12": ["1日3回ゆっくり呼吸する", "吐く息を少し長めにする", "食事中に一度箸を置く"], "13": ["朝のレモン＋りんご酢水", "食後2〜5分動く", "便・尿・汗のどれかを観察する"], "14": ["今日も肉・魚なしで過ごす", "空腹と食欲の違いを意識する", "第1週との変化を振り返る"], "15": ["食後2〜5分身体を動かす", "歩く時間を少し増やす", "動いた後の身体を観察する"], "16": ["椅子からの立ち座りを10回", "カーフレイズを10〜20回", "運動後の温まり方を観察する"], "17": ["ご飯を野菜・たんぱく質・脂質と組み合わせる", "昼食後2〜5分動く", "食後の眠気を観察する"], "18": ["起床後に朝の光を浴びる", "レモン＋りんご酢水を飲む", "起床時の元気度をつける"], "19": ["間食前に10分待つ", "水分を摂り空腹か確認する", "一番空腹だった時間を覚える"], "20": ["就寝1時間前からスマホを減らす", "入浴は就寝1〜2時間前を目安にする", "睡眠の質を意識する"], "21": ["除去食を最後まで丁寧に続ける", "カルシウムDグルカレートは今日で終了", "21日間の変化を3つ思い出す"], "22": ["マルチビタミン・ミネラルを朝2粒・夜2粒", "再導入食品は1種類だけ", "食べる前の状態を確認する"], "23": ["基本の食事を続ける", "身体の反応を観察する", "翌日の身体も見る"], "24": ["再導入は1種類ずつ", "食前食後の違いを確認する", "好みと身体に合うかを分ける"], "25": ["再導入食品を食べすぎない", "少量で反応を観察する", "満足感・眠気・お腹を見る"], "26": ["身体が楽な組み合わせを見つける", "食後2〜5分動く", "食事量を確認する"], "27": ["身についた習慣を3つ思い出す", "続けられるものを1つ選ぶ", "無理していたことを1つ考える"], "28": ["Day1と今日の自分を比べる", "変化を3つ見つける", "続けたいことを1つ決める"]};const fields=['incDay','incM1','incM2','incM3','incBreakfast','incLunch','incSnack','incDinner','incWater','incSupplement','incExercise','incMove','incSleep','incCraving','incFatigue','incBowel','incWeight','incNote','m1','m2','m3','breakfast','lunch','snack','dinner','water','otherDrink','supplement','exercise','move1','move2','move3','sleep','wake','awake','morning','sweet','caffeine','fatigue','bowel','weight','note'];let restoring=false;
const D=s=>{let p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])},Y=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),day=()=>Math.round((D(reportDate.value)-D(START))/86400000)+1,key=()=>`detox-v2:${reportDate.value}`;
function limits(){let t=new Date(),td=new Date(t.getFullYear(),t.getMonth(),t.getDate()),sun=new Date(td);sun.setDate(td.getDate()+(td.getDay()===0?7:7-td.getDay()));reportDate.min=START;reportDate.max=Y(sun>D(END)?D(END):sun);reportDate.value=td<D(START)?START:td>D(reportDate.max)?reportDate.max:Y(td)}
function defaults(){restoring=true;fields.forEach(id=>{let e=document.getElementById(id);if(!e)return;if(e.type==='checkbox')e.checked=true;else if(e.type==='range')e.value=0;else if(e.tagName==='SELECT')e.selectedIndex=0;else e.value=''});['r1','r2','r3'].forEach(n=>document.querySelectorAll(`[name=${n}]`).forEach((e,i)=>e.checked=i===0));let m=missionData[day()];if(m){m1.value=m[0];m2.value=m[1];m3.value=m[2]}preview.textContent='';updateRangeValues();restoring=false}
function serial(action='入力'){let o={action,savedAt:new Date().toISOString()};fields.forEach(id=>{let e=document.getElementById(id);o[id]=e.type==='checkbox'?e.checked:e.value});['r1','r2','r3'].forEach(n=>o[n]=document.querySelector(`[name=${n}]:checked`).value);return o}
function save(action='入力'){if(restoring)return;storage.setItem(key(),JSON.stringify(serial(action)));saveStatus.textContent=`${action} 保存済み ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`}
function load(){defaults();let r=storage.getItem(key());if(r){restoring=true;let o=JSON.parse(r);fields.forEach(id=>{let e=document.getElementById(id);if(id in o) e.type==='checkbox'?e.checked=!!o[id]:e.value=o[id]});['r1','r2','r3'].forEach(n=>{let e=document.querySelector(`[name=${n}][value="${o[n]}"]`);if(e)e.checked=true});restoring=false;updateRangeValues();saveStatus.textContent=`保存内容を復元しました（${o.action||'入力'}）`}else saveStatus.textContent='この日付の保存はありません。新規入力です。';dayStatus.textContent=`Day${day()}（${reportDate.value.replaceAll('-','/')}）`;let w=Math.ceil(day()/7);let themes=[['WEEK 1｜Day1〜7','まずは「整える・減らす・観察する」'],['WEEK 2｜Day8〜14','腸・肝臓・排泄を意識する ※この週は肉・魚お休み'],['WEEK 3｜Day15〜21','代謝・エネルギーを意識する'],['WEEK 4｜Day22〜28','再導入｜「自分の身体の取扱説明書」をつくる']];weekTitle.textContent=themes[w-1][0];weekDesc.textContent=themes[w-1][1]}
function on(id){return document.getElementById(id).checked}
function radio(n){return document.querySelector(`[name=${n}]:checked`).value}
function build(){let a=[];if(on('incDay'))a.push(`📩 DAY ${day()}（${reportDate.value.replaceAll('-','/')}）デトックスチャレンジレポート`);let ms=[];[1,2,3].forEach(i=>{if(on('incM'+i))ms.push(`${['①','②','③'][i-1]} ${document.getElementById('m'+i).value} ${radio('r'+i)}`)});if(ms.length)a.push('', '🌿 今日のMISSION',...ms);let food=[];[['Breakfast','朝','breakfast'],['Lunch','昼','lunch'],['Snack','おやつ','snack'],['Dinner','夜','dinner']].forEach(x=>{if(on('inc'+x[0]))food.push(`${x[1]}：${document.getElementById(x[2]).value}`)});if(food.length)a.push('','🍽 食べたもの',...food);if(on('incWater'))a.push('','💧 水分',`水 ${water.value}L その他（${otherDrink.value}）`);if(on('incSupplement'))a.push('','💊 サプリメント',supplement.value);if(on('incExercise'))a.push('','🏃 活動・運動',exercise.value);if(on('incMove'))a.push('','食後に動けた',`朝 ${move1.value} 昼 ${move2.value} 夜 ${move3.value}`);if(on('incSleep'))a.push('','😴 睡眠',`就寝：${sleep.value} 起床：${wake.value} 中途覚醒：${awake.value} 朝の目覚め：${morning.value}`);if(on('incCraving'))a.push('','🍰 今日の欲求',`甘いもの：${sweet.value} カフェイン：${caffeine.value}`);if(on('incFatigue'))a.push('','⚡ 午後の疲れ・眠気',fatigue.value);if(on('incBowel'))a.push('','💩 お通じ',bowel.value);if(on('incWeight'))a.push('','⚖️ 体重',weight.value+'kg');if(on('incNote'))a.push('','📝 今日の気づき・身体の変化',note.value);return a.join('\n').trim()}
function updateRangeValues(){document.getElementById('sweetValue').textContent=document.getElementById('sweet').value;document.getElementById('caffeineValue').textContent=document.getElementById('caffeine').value;document.getElementById('fatigueValue').textContent=document.getElementById('fatigue').value}
function previewText(){save('内容確認');preview.textContent=build()}function sendLine(){let t=build();save('LINEで送る');location.href='https://line.me/R/msg/text/?'+encodeURIComponent(t)}async function copyText(){let t=build();save('テキストでコピー');try{await navigator.clipboard.writeText(t)}catch(e){let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}alert('コピーしました')}function resetDay(){if(confirm('選択日の保存内容をリセットしますか？')&&confirm('元に戻せません。本当に実行しますか？')){storage.removeItem(key());load()}}
document.addEventListener('input',e=>{if(['sweet','caffeine','fatigue'].includes(e.target.id))updateRangeValues();if(e.target.id!=='reportDate')save()});document.addEventListener('change',e=>{if(e.target.id==='reportDate')load();else save()});limits();load();if(!storage.available){saveStatus.textContent='この表示環境では端末保存が制限されています。GitHub Pagesを通常のブラウザで開くと保存できます。';}
</script></body></html>
